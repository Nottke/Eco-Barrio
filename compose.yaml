services:
  postgres:
    image: postgres:16
    container_name: eco-barrio-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ecobarrio
      POSTGRES_PASSWORD: ecobarrio_dev
      POSTGRES_DB: ecobarrio

    ports:
      - "5432:5432"

    volumes:
      - eco_barrio_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ecobarrio -d ecobarrio"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: eco-barrio-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://ecobarrio:ecobarrio_dev@postgres:5432/ecobarrio?schema=public
      JWT_SECRET: ${JWT_SECRET:-eco_barrio_dev_secret}
      PORT: 3000

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: eco-barrio-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend

volumes:
  eco_barrio_postgres_data: